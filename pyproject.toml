[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay-coder"
version = "0.1.0"
description = "Chain AI coding agents like a CI pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "watchdog>=3.0.0",
    "eval_type_backport>=0.1.0; python_version<'3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
relay = "relay.cli:app"

[project.urls]
Homepage = "https://github.com/danielfbmbot/relay"
Issues = "https://github.com/danielfbmbot/relay/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=relay --cov-report=term-missing"
